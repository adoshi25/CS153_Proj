<!DOCTYPE html>
<html>
<head><meta charset="UTF-8">
<style>
* { margin:0; padding:0; }
body { background:#fff; display:flex; flex-direction:column; align-items:center; padding:16px; font-family:'Helvetica Neue',Arial,sans-serif; }

@keyframes fadeUp {
  from { opacity:0; transform:translateY(10px); }
  to   { opacity:1; transform:translateY(0); }
}
.g1 { opacity:0; animation: fadeUp 0.7s ease forwards; animation-delay: 0.2s; }
.g2 { opacity:0; animation: fadeUp 0.7s ease forwards; animation-delay: 0.9s; }
.g3 { opacity:0; animation: fadeUp 0.7s ease forwards; animation-delay: 1.6s; }
.g4 { opacity:0; animation: fadeUp 0.7s ease forwards; animation-delay: 2.3s; }
.g5 { opacity:0; animation: fadeUp 0.7s ease forwards; animation-delay: 3.0s; }
.g6 { opacity:0; animation: fadeUp 0.7s ease forwards; animation-delay: 3.7s; }

button {
  margin-top: 28px; padding: 6px 20px; font-size: 12px; font-family: inherit;
  border: 1px solid #d1d5db; border-radius: 6px; background: #f9fafb;
  color: #374151; cursor: pointer;
}
button:hover { background: #f3f4f6; }
</style>
</head>
<body>
<svg id="diagram" width="740" height="494" viewBox="0 0 740 494"
     font-family="'Helvetica Neue', Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">

  <rect width="740" height="494" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#374151"/>
    </marker>
  </defs>


  <!-- G1: Heading -->
  <g class="g1">
    <text x="370" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Memory Stream</text>
  </g>


  <!-- G2: Memory stream cards + info note -->
  <g class="g2">
    <!-- m1 -->
    <rect x="40"  y="52" width="148" height="64" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
    <rect x="40"  y="52" width="148" height="20" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.1"/>
    <rect x="40"  y="62"  width="148" height="10" fill="#dbeafe"/>
    <text x="114" y="67"  text-anchor="middle" font-size="9"   font-weight="600" fill="#1d4ed8">m₁</text>
    <text x="114" y="86" text-anchor="middle" font-size="9"   fill="#374151">"Spoke with Marcus…"</text>
    <text x="114" y="99" text-anchor="middle" font-size="8.5" fill="#6b7280">day 3  ·  housing, rent</text>
    <text x="114" y="111" text-anchor="middle" font-size="8.5" fill="#3b82f6">importance: 7.4</text>

    <!-- m2 -->
    <rect x="200" y="52" width="148" height="64" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
    <rect x="200" y="52" width="148" height="20" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.1"/>
    <rect x="200" y="62"  width="148" height="10" fill="#dbeafe"/>
    <text x="274" y="67"  text-anchor="middle" font-size="9"   font-weight="600" fill="#1d4ed8">m₂</text>
    <text x="274" y="86" text-anchor="middle" font-size="9"   fill="#374151">"Rent increase worries…"</text>
    <text x="274" y="99" text-anchor="middle" font-size="8.5" fill="#6b7280">day 5  ·  eviction, rent</text>
    <text x="274" y="111" text-anchor="middle" font-size="8.5" fill="#3b82f6">importance: 5.1</text>

    <!-- m3 -->
    <rect x="360" y="52" width="148" height="64" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
    <rect x="360" y="52" width="148" height="20" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.1"/>
    <rect x="360" y="62"  width="148" height="10" fill="#dbeafe"/>
    <text x="434" y="67"  text-anchor="middle" font-size="9"   font-weight="600" fill="#1d4ed8">m₃</text>
    <text x="434" y="86" text-anchor="middle" font-size="9"   fill="#374151">"Community meeting…"</text>
    <text x="434" y="99" text-anchor="middle" font-size="8.5" fill="#6b7280">day 7  ·  protest</text>
    <text x="434" y="111" text-anchor="middle" font-size="8.5" fill="#3b82f6">importance: 8.2</text>

    <!-- dots -->
    <text x="530" y="78" text-anchor="middle" font-size="18" fill="#9ca3af" letter-spacing="4">· · ·</text>

    <!-- mN -->
    <rect x="556" y="52" width="148" height="64" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
    <rect x="556" y="52" width="148" height="20" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.1"/>
    <rect x="556" y="62"  width="148" height="10" fill="#dbeafe"/>
    <text x="630" y="67"  text-anchor="middle" font-size="9"   font-weight="600" fill="#1d4ed8">mₙ</text>
    <text x="630" y="86" text-anchor="middle" font-size="9"   fill="#374151">"Heard about demo plan…"</text>
    <text x="630" y="99" text-anchor="middle" font-size="8.5" fill="#6b7280">day 11  ·  demolition</text>
    <text x="630" y="111" text-anchor="middle" font-size="8.5" fill="#3b82f6">importance: 6.8</text>

    <!-- info note box -->
    <rect x="50" y="122" width="640" height="26" rx="4" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.1"/>
    <text x="370" y="139" text-anchor="middle" font-size="8.5" fill="#6b7280">each mᵢ stores: content  ·  timestamp  ·  topic keywords  ·  importance score rated 1–10 by the LLM</text>
  </g>


  <!-- G3: Retrieval Scoring box -->
  <g class="g3">
    <line x1="370" y1="148" x2="370" y2="168" stroke="#374151" stroke-width="1.3" marker-end="url(#arr)"/>

    <rect x="50" y="172" width="640" height="162" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="370" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">Retrieval Scoring</text>
    <text x="370" y="207" text-anchor="middle" font-size="10" fill="#6366f1">score( m, q )  =  [ R(m)  +  I(m)  +  V(m, q) ]  ÷  3</text>

    <line x1="68" y1="215" x2="672" y2="215" stroke="#c7d2fe" stroke-width="0.9"/>

    <!-- R(m) -->
    <text x="68"  y="232" font-size="10" font-weight="700" fill="#374151">R(m)</text>
    <text x="118" y="232" font-size="10" fill="#4b5563">Recency</text>
    <text x="190" y="232" font-size="10" fill="#4b5563">—</text>
    <text x="204" y="232" font-size="10" font-weight="600" fill="#374151">0.995 ^ ( t − tₘ )</text>
    <text x="68"  y="245" font-size="9"  fill="#6b7280">t = current day  ·  tₘ = day memory was stored  ·  recent memories score higher</text>
    <line x1="68" y1="253" x2="672" y2="253" stroke="#c7d2fe" stroke-width="0.8"/>

    <!-- I(m) -->
    <text x="68"  y="270" font-size="10" font-weight="700" fill="#374151">I(m)</text>
    <text x="118" y="270" font-size="10" fill="#4b5563">Importance</text>
    <text x="190" y="270" font-size="10" fill="#4b5563">—</text>
    <text x="204" y="270" font-size="10" font-weight="600" fill="#374151">LLM score ( 1–10 )  ÷  10</text>
    <text x="68"  y="283" font-size="9"  fill="#6b7280">Sonnet-rated at write time, normalized to [0,1]  ·  Reflection triggers when cumulative importance ≥ 24</text>
    <line x1="68" y1="291" x2="672" y2="291" stroke="#c7d2fe" stroke-width="0.8"/>

    <!-- V(m,q) -->
    <text x="68"  y="308" font-size="10" font-weight="700" fill="#374151">V(m, q)</text>
    <text x="118" y="308" font-size="10" fill="#4b5563">Relevance</text>
    <text x="190" y="308" font-size="10" fill="#4b5563">—</text>
    <text x="204" y="308" font-size="10" font-weight="600" fill="#374151">keyword_overlap( m, q )</text>
    <text x="68"  y="321" font-size="9"  fill="#6b7280">q = current shock text  ·  memories topically relevant to this shock score higher</text>
  </g>


  <!-- G4: Top-k output -->
  <g class="g4">
    <line x1="370" y1="334" x2="370" y2="354" stroke="#374151" stroke-width="1.3" marker-end="url(#arr)"/>
    <text x="370" y="365" text-anchor="middle" font-size="9" fill="#6b7280">top-k memories selected  →  inserted into agent context window</text>
    <rect x="170" y="377" width="400" height="30" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <text x="370" y="397" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Top-k retrieved memories  →  Agent context window</text>
  </g>


  <!-- G5: Post-shock update -->
  <g class="g5">
    <rect x="50" y="419" width="640" height="42" rx="4" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.1"/>
    <text x="370" y="436" text-anchor="middle" font-size="9" fill="#374151">save_experiences()  persists  stance · rationale · location · conversations  after every completed simulation</text>
    <text x="370" y="451" text-anchor="middle" font-size="9" font-weight="700" fill="#1d4ed8">→  read at the start of every future shock  —  each agent remembers its history</text>
  </g>


  <!-- G6: Caption -->
  <g class="g6">
    <text x="370" y="482" text-anchor="middle" font-size="9" font-weight="700" fill="#6b7280">Retrieval scoring formula from Park et al., 2023 (Generative Agents)  ·  implemented in engine/memory.py</text>
  </g>

</svg>

<button onclick="replay()">↺ Replay animation</button>

<script>
function replay() {
  const svg = document.getElementById('diagram');
  const groups = svg.querySelectorAll('[class^="g"]');
  groups.forEach(g => { g.style.animation = 'none'; g.style.opacity = '0'; });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    groups.forEach(g => { g.style.animation = ''; g.style.opacity = ''; });
  }));
}
</script>
</body></html>
